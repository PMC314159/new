<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>예약된 메시지</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#1b1b20;color:#eeeef2;font:14px system-ui,'Malgun Gothic',sans-serif}header{padding:22px 5vw;border-bottom:1px solid #ffffff18}main{max-width:1240px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:38px;padding:30px}.stage{text-align:center;min-width:0}canvas{display:block;width:100%;max-width:570px;margin:auto;aspect-ratio:4/5;border:1px solid #ffffff18;border-radius:8px}.controls{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:17px}button,input,textarea,select{font:inherit}button,.file{cursor:pointer;background:#303039;color:#eeeef2;border:1px solid #ffffff20;border-radius:6px;padding:10px 13px}button:hover,.file:hover{background:#42414d}button.primary{background:#dedbe7;color:#282430}button:disabled{opacity:.4;cursor:wait}aside{border-left:1px solid #ffffff18;padding-left:28px}h1{font-size:25px;font-weight:500;margin:3px 0 12px}.note{font-size:11px;color:#a8a5b3;line-height:1.9}label{display:block;font-size:12px;color:#c1bdcd;margin:17px 0 7px}input:not([type=file]),textarea,select{width:100%;background:#25252d;border:1px solid #ffffff20;border-radius:5px;color:#eee;padding:10px}textarea{resize:vertical;min-height:68px;line-height:1.6}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input[type=file]{display:none}.file{text-align:center}#status{min-height:20px;font-size:12px;color:#d2c5e8;margin-top:13px}dialog{background:#292730;color:#eee;border:1px solid #ffffff30;border-radius:15px;padding:25px;width:min(420px,90vw)}dialog::backdrop{background:#0009}dialog h2{font-size:20px;margin:0 0 15px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}[hidden]{display:none!important}:focus-visible{outline:2px solid #c9b8df;outline-offset:3px}@media(max-width:800px){main{grid-template-columns:1fr;padding:20px 15px}aside{border:0;padding:0;max-width:570px;width:100%;margin:auto}}
.crop-controls{padding:4px 10px 12px;border:1px solid #ffffff16;border-radius:7px;margin-top:10px}.crop-controls label{margin-top:10px}.crop-controls input[type=range]{padding:0;accent-color:#bdb5cd;width:100%}.editor-category{border:1px solid #ffffff18;border-radius:9px;margin:13px 0;overflow:hidden}.editor-category summary{cursor:pointer;padding:14px;font-size:13px;color:#e1dce9;list-style:none;display:flex;justify-content:space-between;align-items:center}.editor-category summary::-webkit-details-marker{display:none}.editor-category summary::after{content:"＋";color:#a9a0b9}.editor-category[open] summary::after{content:"−"}.editor-category[open] summary{border-bottom:1px solid #ffffff12}.category-body{padding:0 14px 14px}.category-body>label:first-child{margin-top:13px}#canvasHost{position:relative;max-width:570px;margin:auto}#phoneReply{position:absolute;z-index:2;resize:none;background:transparent!important;border:0!important;outline:none!important;color:transparent;caret-color:#333;padding:0;box-shadow:none;overflow:hidden}input[type=checkbox]{width:auto!important}input[type=color]{height:38px;padding:3px!important}</style></head><body><header>예약된 메시지</header><main><section class="stage"><div id="canvasHost"><textarea id="phoneReply" maxlength="90" aria-label="휴대폰 안에 답장 입력" hidden></textarea><canvas id="screen" width="960" height="1200" role="img" aria-label="휴대폰 메시지 미리보기"></canvas></div><div class="controls"><button class="primary" id="play">자동 재생</button><button id="reset">처음으로</button><button id="next">알림 받기</button><button id="reply" hidden>답장</button><button id="png">PNG 저장</button><button id="video">MP4 저장</button></div><div id="status" role="status" aria-live="polite"></div><p class="note">배경화면 → 새 메시지 알림 → 확인 → 다음 문자<br>휴대폰 안의 버튼이나 아래 버튼으로 조작해 주십시오. 자동 재생으로 전체 이야기를 볼 수 있습니다.</p></section><aside>
<details class="editor-category" open ><summary>휴대폰</summary><div class="category-body"><label for="phone">휴대폰</label><select id="phone"><option value="flip">폴더폰</option><option value="smart">스마트폰</option></select>
</div></details><details class="editor-category" open ><summary>배경화면</summary><div class="category-body"><label>배경화면 사진 · 선택 사항</label><label class="file" tabindex="0" for="photo">＋ 사진 업로드</label><input id="photo" type="file" accept="image/*"><button id="remove" style="width:100%;margin-top:7px">기본 배경으로</button><div class="crop-controls"><label for="wallX">좌우 이동</label><input id="wallX" type="range" min="-100" max="100" step="1" value="0" aria-label="좌우 이동"><label for="wallY">상하 이동</label><input id="wallY" type="range" min="-100" max="100" step="1" value="0" aria-label="상하 이동"><label for="wallZoom">확대 / 축소</label><input id="wallZoom" type="range" min="0.5" max="3" step="0.05" value="1" aria-label="확대 / 축소"><button id="wallReset" style="width:100%;margin-top:8px">사진 위치 초기화</button></div><p class="note">사진 없이도 사용할 수 있습니다. 사진은 화면에 맞게 중앙을 잘라 표시하며 외부로 전송하지 않습니다.</p></div></details><details class="editor-category" open><summary>시간 표시</summary><div class="category-body"><label><input type="checkbox" id="showTime" checked> 시간 표시</label><label for="timeColor">시간 글자색</label><input type="color" id="timeColor" value="#ffffff"></div></details><details class="editor-category" open ><summary>발신인 · 날짜</summary><div class="category-body"><div id="profileSettings"><label>발신인 프로필 사진 · 스마트폰</label><label class="file" for="avatar">＋ 프로필 사진 업로드</label><input id="avatar" type="file" accept="image/*"><button id="removeAvatar" style="width:100%;margin-top:7px">기본 프로필로</button><div class="crop-controls"><label for="avatarX">좌우 이동</label><input id="avatarX" type="range" min="-100" max="100" step="1" value="0" aria-label="좌우 이동"><label for="avatarY">상하 이동</label><input id="avatarY" type="range" min="-100" max="100" step="1" value="0" aria-label="상하 이동"><label for="avatarZoom">확대 / 축소</label><input id="avatarZoom" type="range" min="0.5" max="3" step="0.05" value="1" aria-label="확대 / 축소"><button id="avatarReset" style="width:100%;margin-top:8px">사진 위치 초기화</button></div></div><label for="sender">발신인 / 저장된 이름</label><input id="sender" maxlength="16" value="저장된 이름"><div class="row"><div><label for="reserved">예약한 날짜</label><input id="reserved" type="date" value="2023-10-31"></div><div><label for="arrival">도착한 날짜</label><input id="arrival" type="date" value="2026-10-31"></div></div>
</div></details><details class="editor-category" open ><summary>예약 문자</summary><div class="category-body"><div id="reservedList"></div><button id="addMessage" style="width:100%;margin-top:12px">＋ 예약 문자 추가</button><p class="note" id="messageCount"></p></div></details><details class="editor-category" open ><summary>마지막 전개</summary><div class="category-body"><label for="preset">마지막 전개</label><select id="preset"><option value="horror">“왜 이제 읽어?”</option><option value="sad">“더 이상 사용하지 않는 번호입니다.”</option><option value="warm">“오늘은 돌아가도 되는 날이라며.”</option><option value="linger">“끝내 도착하지 않은 문자”</option></select><p class="note" id="presetNote"></p>
<div id="lastMessage"><label for="message3">결말 / 방금 수신</label><textarea id="message3" maxlength="90"></textarea></div><div id="fourthMessage"><label for="message4">결말 / 이어지는 문자</label><textarea id="message4" maxlength="90">문 좀 열어 줘.</textarea></div><div id="postscriptSettings"><label for="postscript">마지막 안내 문구</label><input id="postscript" maxlength="65"></div>
<div id="exportReplySettings" hidden><label for="exportReply">영상에 넣을 답장 · 첫 번째 결말</label><textarea id="exportReply" maxlength="90">보고 싶었어.</textarea><p class="note">직접 볼 때는 답장을 입력하며, 영상 저장 시에는 위 답장을 사용합니다.</p></div></div></details><p class="note">PNG는 현재 화면을, 영상은 전체 이야기를 저장합니다. 영상은 소리 없는 MP4로 저장됩니다.</p></aside></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('screen'),ctx=canvas.getContext('2d');
const presets={
 sad:{end:'더 이상 사용하지 않는 번호입니다.',note:'예약 문자를 읽고 직접 답장을 작성해 보내면, 사용하지 않는 번호라는 알림이 표시됩니다.'},
 horror:{end:'',note:'예약 문자를 모두 읽으면, 방금 수신한 “왜 이제 읽어?”가 도착합니다.'},
 warm:{end:'',note:'예약 문자 뒤에 “오늘은 돌아가도 되는 날이라며.”, “문 좀 열어 줘.”가 차례로 도착합니다.'},
 linger:{end:'메시지가 삭제되었습니다.',note:'예약 메시지를 모두 확인한 뒤 입력 표시가 나타났다가 사라지고, 삭제된 메시지 한 줄이 남습니다.'}
};
let avatar=null,avatarToken=0,replyAlert=false,dismissedAlert=false,bubbleSize=20,composing=false;let reservedMessages=['내가 없어도\n밥은 잘 챙겨 먹어.','가끔은\n내 생각도 해 주고.'];
let photo=null,photoToken=0,index=0,playing=false,recording=false,raf=0,started=0,hits=[],replyState=null,screenBox,arrivalTimer;
const fields=['sender','reserved','arrival','message3','message4','postscript'],data=()=>Object.fromEntries(fields.map(k=>[k,$(k).value]));
function story(){const p=$('preset').value,a=[{type:'lock',ms:2300},{type:'notification',ms:2600},...reservedMessages.map((m,i)=>({type:'message',n:i+1,ms:Math.max(3800,m.length*85)})),{type:'notice',ms:2400}];if(p==='sad')a.push({type:'awaitReply',ms:3800},{type:'replyEnd',ms:4000});else if(p==='linger')a.push({type:'typing',ms:3500},{type:'unsentEnd',ms:4000});else {a.push({type:'typing',ms:2300},{type:'message',final:1,ms:4200});if(p==='warm')a.push({type:'message',final:2,ms:4200})}return a}
const current=()=>story()[index];
function round(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function phoneFont(size){return `${size}px ${$('phone').value==='flip'?'GulimChe, "굴림체", Gulim, "굴림", Dotum, "돋움", monospace':'-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'}`}
function text(s,x,y,size=20,color='#2b2933',align='left'){ctx.font=phoneFont(size);ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(s,x,y)}
function lines(s,w,size){ctx.font=phoneFont(size);const a=[];for(const p of s.split('\n')){let row='';for(const ch of p){if(ctx.measureText(row+ch).width>w){a.push(row);row=''}row+=ch}a.push(row)}return a}
function fit(s,x,y,w,maxHeight,size=24,color='#2b2933'){while(lines(s,w,size).length*size*1.5>maxHeight&&size>13)size--;lines(s,w,size).forEach((l,i)=>text(l,x,y+i*size*1.5,size,color))}
function dateLabel(s){return(s||'----.--.--').replaceAll('-','.')}
function imageAt(img,x,y,w,h,key){const zoom=Number($(key+'Zoom').value)||1,dx=Number($(key+'X').value)||0,dy=Number($(key+'Y').value)||0,f=Math.max(w/img.width,h/img.height)*zoom;ctx.drawImage(img,x+(w-img.width*f)/2+dx*w/100,y+(h-img.height*f)/2+dy*h/100,img.width*f,img.height*f)}
function cover(img,w,h){imageAt(img,0,0,w,h,'wall')}
function hit(x,y,w,h,action){hits.push({x,y,w,h,action})}
function screenHit(x,y,w,h,action){const b=screenBox,s=b.w/400;hit(b.x+x*s,b.y+y*s,w*s,h*s,action)}
function screenButton(label,x,y,w,action,smart){round(x,y,w,38,smart?12:4,'#f2f1f6','#9b98a455');text(label,x+w/2,y+25,15,'#302c38','center');screenHit(x,y,w,38,action)}
function popup(title,body,h,smart,action=advance){const top=(h-195)/2;ctx.fillStyle='#17131e55';ctx.fillRect(0,36,400,h-36);round(26,top,348,195,smart?19:6,smart?'#f4f2f8':'#dadde5','#95939f');text(title,200,top+36,19,'#2a2732','center');fit(body,48,top+73,304,62,18);screenButton('확인',139,top+145,122,action,smart)}
function profile(x,y,r){ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.clip();if(avatar){ctx.fillStyle='#d8d8df';ctx.fillRect(x-r,y-r,r*2,r*2);imageAt(avatar,x-r,y-r,r*2,r*2,'avatar')}else{ctx.fillStyle='#9999a3';ctx.fillRect(x-r,y-r,r*2,r*2);text(($('sender').value||'?')[0],x,y+r*.35,r,'#fff','center')}ctx.restore()}
function bubble(message,y,out=false){const size=bubbleSize,w=300,ls=lines(message,w-32,size),bh=ls.length*size*1.45+24,x=out?70:19;round(x,y,w,bh,19,out?'#73c66b':'#e6e6eb');ctx.fillStyle=out?'#73c66b':'#e6e6eb';ctx.beginPath();ctx.moveTo(out?367:22,y+bh-16);ctx.lineTo(out?379:10,y+bh);ctx.lineTo(out?347:42,y+bh-2);ctx.fill();fit(message,x+16,y+32,w-32,bh-10,size);return y+bh+14}
function clock(label,x,y,size,color,align='left'){if($('showTime').checked)text(label,x,y,size,$('timeColor').value,align)}
function messageText(step,d){return step.final?d[step.final===1?'message3':'message4']:reservedMessages[(step.n||reservedMessages.length)-1]}
function renderComposer(h,smart,d,draft=$('phoneReply').value){ctx.fillStyle=smart?'#fff':'#cdd1dc';ctx.fillRect(0,45,400,h-45);text('받는 사람: '+d.sender,22,88,18);text('답장 작성',22,126,13,'#888');const y=155,bh=h-250;round(20,y,360,bh,smart?19:5,smart?'#e6e6eb':'#e4e6ec');fit(draft,34,y+30,330,bh-20,20);screenButton('취소',22,h-62,100,cancelComposer,smart);screenButton('보내기',265,h-62,113,sendComposer,smart);const b=screenBox,k=b.w/400;Object.assign($('phoneReply').style,{left:(b.x+34*k)/960*100+'%',top:(b.y+(y+9)*k)/1200*100+'%',width:330*k/960*100+'%',height:(bh-20)*k/1200*100+'%'})}
function renderScreen(b,smart,now){screenBox=b;const k=b.w/400,h=b.h/k,d=data(),step=current(),lock=['lock','notification'].includes(step.type);ctx.save();ctx.translate(b.x,b.y);ctx.scale(k,k);ctx.beginPath();ctx.roundRect(0,0,400,h,smart?34:12);ctx.clip();
if(lock){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#a4a3ae');g.addColorStop(1,'#555660');ctx.fillStyle=g;ctx.fillRect(0,0,400,h);if(photo)cover(photo,400,h)}else{ctx.fillStyle=smart?'#fff':'#cdd1dc';ctx.fillRect(0,0,400,h)}
clock(step.type==='lock'?'23:59':'00:00',23,29,14,'#fff');
if(lock){clock(step.type==='lock'?'23:59':'00:00',200,h*.25,smart?65:54,'#fff','center');text(dateLabel(d.arrival),200,h*.25+37,16,'#fff','center');if(step.type==='notification'){const top=h*.49;round(16,top,368,160,smart?19:6,'#eeeef1f5');if(smart){round(31,top+15,23,23,5,'#65c75c');round(35,top+20,15,11,5,'#fff');text('MESSAGES',65,top+32,13,'#777');text('now',368,top+32,13,'#777','right')}else{text('문자 수신',34,top+32,17,'#444');ctx.fillStyle='#88888855';ctx.fillRect(34,top+43,332,1)}text(d.sender,34,top+66,19);text('예약된 메시지가 '+reservedMessages.length+'통 있습니다.',34,top+95,16);text(lines(reservedMessages[0],315,14)[0].slice(0,24)+(reservedMessages[0].length>24?'…':''),34,top+124,14,'#666');screenHit(16,top,368,160,advance)}}
else if(smart){profile(200,79,24);text('‹',20,94,38,'#4389e9');text(d.sender+' ›',200,123,14,'#555','center');ctx.fillStyle='#ddd';ctx.fillRect(0,142,400,1);text('iMessage',200,170,12,'#999','center');text(dateLabel(d.arrival)+' 00:00',200,190,12,'#999','center');
const count=step.n||reservedMessages.length,visible=reservedMessages.slice(0,count);if(step.final)visible.push(d.message3);if(step.final===2)visible.push(d.message4);const outgoing=replyState?.text||(step.type==='replyEnd'?$('exportReply').value:'');if(outgoing)visible.push(outgoing);bubbleSize=20;while(bubbleSize>12&&visible.reduce((a,m)=>a+lines(m,268,bubbleSize).length*bubbleSize*1.45+38,0)>h-320)bubbleSize--;const heights=visible.map(m=>lines(m,268,bubbleSize).length*bubbleSize*1.45+38);let skip=0,total=heights.reduce((a,v)=>a+v,0);while(total>h-320&&skip<visible.length-1)total-=heights[skip++];let y=210;if(skip)text('이전 메시지 '+skip+'개',200,199,11,'#aaa','center');visible.slice(skip).forEach((m,i)=>{y=bubble(m,y,!!outgoing&&i===visible.length-skip-1)});
if(step.type==='typing'){round(20,y,91,47,23,'#e6e6eb');round(12,y+36,13,13,7,'#e6e6eb');for(let i=0;i<3;i++){ctx.fillStyle='rgba(145,145,153,'+(.5+.4*Math.sin(now/300-i))+')';ctx.beginPath();ctx.arc(42+i*24,y+24,8,0,Math.PI*2);ctx.fill()}}if(step.type==='unsentEnd')fit(d.postscript,23,y+24,350,80,16,'#999');round(60,h-56,321,38,20,'#fff','#ddd');text('iMessage',78,h-31,16,'#aaa');text('↑',354,h-31,21,'#999');screenHit(60,h-56,321,38,openReply);
}else{text(d.sender,200,68,22,'#333','center');text(step.final?'방금 수신':'예약 메시지 · '+dateLabel(d.reserved),22,116,13,'#777');fit(messageText(step,d),24,162,352,h-264,25);text(step.final?'새 메시지':(step.n||reservedMessages.length)+' / '+reservedMessages.length,200,h-80,13,'#777','center');screenButton('답장',20,h-55,106,openReply,false);screenButton(index===story().length-1?'처음으로':'다음 문자',245,h-55,135,advance,false);if(step.type==='typing')popup('메시지','새 메시지 입력 중…',h,false);if(step.type==='unsentEnd')popup('메시지',d.postscript,h,false)}
if(!lock){if(step.type==='notice')popup('알림','예약 메시지 '+reservedMessages.length+'통을 모두 확인했습니다.',h,smart);if(step.type==='awaitReply')screenButton('답장 작성',124,h-121,152,openReply,smart);if(step.type==='replyEnd'&&!smart){ctx.fillStyle='#cdd1dc';ctx.fillRect(0,103,400,h-180);text('나의 답장',24,132,13,'#777');fit(replyState?.text||$('exportReply').value,24,176,352,h-270,22)}if(step.type==='replyEnd'&&(!dismissedAlert||recording))popup('전송 실패',d.postscript,h,smart,()=>{dismissedAlert=true;draw()});else if(replyState&&replyAlert)popup('전송 실패',replyState.result,h,smart,()=>{replyAlert=false;draw()})}
if(composing)renderComposer(h,smart,d);else if(recording&&step.type==='awaitReply'){const elapsed=now-story().slice(0,index).reduce((a,s)=>a+s.ms,0),draft=$('exportReply').value;renderComposer(h,smart,d,draft.slice(0,Math.floor(draft.length*Math.min(1,elapsed/2800))))}if(!smart){ctx.fillStyle='#22222208';for(let y=0;y<h;y+=4)ctx.fillRect(0,y,400,1)}ctx.restore()}
for(const key of ['avatar','wall']){for(const axis of ['X','Y','Zoom'])$(key+axis).oninput=()=>{stop();if(key==='wall'){index=0;replyState=null;closeComposer()}else if($('phone').value==='smart'&&index<2)index=2;draw()};$(key+'Reset').onclick=()=>{for(const axis of ['X','Y','Zoom'])$(key+axis).value=axis==='Zoom'?1:0;stop();if(key==='wall')index=0;draw()}}
$('avatar').onchange=async e=>{const file=e.target.files[0];if(!file)return;const token=++avatarToken,url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();if(token===avatarToken){avatar=img;draw()}}catch{$('status').textContent='プロ필 사진을 읽지 못했습니다.'}finally{URL.revokeObjectURL(url)}};$('removeAvatar').onclick=()=>{avatarToken++;avatar=null;$('avatar').value='';draw()};

function syncControls(){const s=current(),last=index===story().length-1;$('next').textContent=s.type==='lock'?'알림 받기':s.type==='notification'?'확인':last?'처음으로':s.type==='notice'?'확인':'다음 문자';$('reply').hidden=!['message','awaitReply'].includes(s.type);if(s.type==='awaitReply')$('next').textContent='답장 작성';canvas.setAttribute('aria-label','휴대폰 미리보기: '+(s.type==='lock'?'배경화면':s.type==='notification'?'새 메시지 알림':s.type==='message'?'문자 '+s.n:s.type==='end'?'마지막 안내':'메시지 안내')+'. 아래 버튼으로 조작할 수 있습니다.')}
function stop(){playing=false;cancelAnimationFrame(raf);clearTimeout(arrivalTimer);$('play').textContent='자동 재생'}

function closeComposer(){composing=false;$('phoneReply').hidden=true}

function sendComposer(){const value=$('phoneReply').value.trim();if(!value)return;replyState={text:value,result:$('preset').value==='sad'?$('postscript').value:'수신인에게 연결할 수 없습니다.'};closeComposer();replyAlert=true;dismissedAlert=false;if($('preset').value==='sad')index=story().length-1;draw()}
